<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f1f8" />
<title>Orbit Desk</title>
<style>
  :root {
    --bg: #f3f1f8;
    --card: #ffffff;
    --ink: #1d1d1f;
    --ink2: #6e6e73;
    --ink3: #aeaeb2;
    --line: rgba(60,60,67,0.1);
    --accent: #0071e3;
    --tag-career: #e8def8; --tag-career-ink: #5b3cc4;
    --tag-love: #ffd6e0; --tag-love-ink: #c2185b;
    --tag-side: #ececec; --tag-side-ink: #555;
    --tag-life: #d8f5e2; --tag-life-ink: #1b7a3d;
    --tag-ai: #d6e4ff; --tag-ai-ink: #245bdb;
    --tag-note: #ffe8cc; --tag-note-ink: #9a5b00;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --dock-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; border: none; background: none; }
  button { cursor: pointer; }

  .shell { max-width: 1180px; margin: 0 auto; padding: 0 16px calc(var(--dock-h) + 28px); }

  .cover {
    height: 140px; margin: 0 -12px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.30)),
      url("./assets/cover.svg") center/cover no-repeat,
      linear-gradient(120deg, #c9c3f2 0%, #e9c7e0 45%, #f6d9c4 100%);
    position: relative;
  }
  @media (min-width: 900px) { .cover { height: 190px; border-radius: 0 0 4px 4px; margin: 0; } }
  .cover-inner {
    position: absolute; left: 16px; right: 16px; bottom: 14px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  }
  .cover h1 { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; text-shadow: 0 1px 8px rgba(0,0,0,0.25); }
  .cover .sub { color: rgba(255,255,255,0.85); font-size: 12px; margin-top: 2px; }

  .capture {
    margin-top: -18px; position: relative; z-index: 2;
    display: flex; gap: 8px; align-items: center;
    background: var(--card); border-radius: 14px; padding: 6px 6px 6px 12px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .capture input { flex: 1; min-width: 0; height: 36px; font-size: 14px; outline: none; }
  .capture input::placeholder { color: var(--ink3); }
  .capture .go {
    width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff;
    display: grid; place-items: center; flex-shrink: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-items: start;
  }
  /* mobile base — R19 sets commute row order */
  @media (max-width: 899px) {
    .grid > .col-mid { display: flex; flex-direction: column; gap: 8px; }
    .grid > .col-mid #sec-month { grid-column: auto; grid-row: auto; }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: 260px 1fr 280px; align-items: start; }
  }

  .card {
    background: var(--card); border-radius: 14px; padding: 14px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .card + .card { margin-top: 14px; }
  .card h2 {
    font-size: 13px; font-weight: 600; color: var(--ink2);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .card h2 .count {
    font-size: 11px; background: #f0f0f2; color: var(--ink2);
    padding: 1px 7px; border-radius: 99px; font-weight: 500;
  }

  .profile { display: flex; gap: 10px; align-items: flex-start; }
  .avatar {
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    background: #e8e8ed; /* no gradient fake */
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px;
  }
  .profile .name { font-size: 14px; font-weight: 650; }
  .profile .role { font-size: 11px; color: var(--ink2); margin-top: 2px; }
  .motto { margin-top: 10px; font-size: 12px; color: var(--ink2); line-height: 1.55; }
  .motto li { list-style: none; padding: 2px 0; display: flex; align-items: flex-start; gap: 4px; }
  .motto li::before { content: "· "; color: var(--ink3); }

  .fat-stub {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    background: #f7f7f9; border: 1px dashed var(--line);
  }
  .fat-stub .lab { font-size: 11px; font-weight: 650; color: var(--ink2); margin-bottom: 6px; }
  .fat-stub .rows { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink); }
  .fat-stub .rows b { font-variant-numeric: tabular-nums; font-weight: 600; }

  .quote {
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.55;
    margin-bottom: 8px; border-left: 3px solid transparent;
  }
  .quote:last-child { margin-bottom: 0; }
  .quote.pink { background: #ffe8ef; color: #8b2048; border-left-color: #f48fb1; }
  .quote.blue { background: #e8f1ff; color: #1e4a8c; border-left-color: #90caf9; }
  .quote.green { background: #e6f7ed; color: #1b5e35; border-left-color: #81c784; }
  .quote.tan { background: #fff3e0; color: #7a4a12; border-left-color: #ffb74d; }

  .month-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .month-head .title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .month-head .desc { font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0 10px; }
  .tab { font-size: 12px; padding: 4px 10px; border-radius: 8px; color: var(--ink2); background: #f2f2f4; }
  .tab.on { background: #1d1d1f; color: #fff; }
  .month-banner {
    font-size: 12px; color: var(--ink2); background: #f4f2fa; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 8px; line-height: 1.45;
  }
  .group-label {
    font-size: 12px; font-weight: 650; color: var(--ink2);
    padding: 10px 0 6px; border-top: 1px solid var(--line); margin-top: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .group-label:first-child { border-top: none; margin-top: 0; padding-top: 2px; }
  .group-label .pill {
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px;
  }
  .row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 4px; border-radius: 8px;
  }
  .row:hover { background: rgba(0,0,0,0.02); }
  .row .ico {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px; background: #f4f4f6;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .row.done .t { color: var(--ink3); text-decoration: line-through; }
  .row .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 5px; font-weight: 500; }
  .tag.career { background: var(--tag-career); color: var(--tag-career-ink); }
  .tag.love { background: var(--tag-love); color: var(--tag-love-ink); }
  .tag.side { background: var(--tag-side); color: var(--tag-side-ink); }
  .tag.life { background: var(--tag-life); color: var(--tag-life-ink); }
  .tag.ai { background: var(--tag-ai); color: var(--tag-ai-ink); }
  .tag.note { background: var(--tag-note); color: var(--tag-note-ink); }
  .check {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
    border: 1.5px solid #c7c7cc; display: grid; place-items: center;
  }
  .check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .check.on::after { content: "✓"; font-size: 11px; font-weight: 700; }

  .cat { margin-bottom: 12px; }
  .cat:last-child { margin-bottom: 0; }
  .cat-h { font-size: 13px; font-weight: 650; margin-bottom: 6px; }
  .todo-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 0; font-size: 13px; line-height: 1.4;
  }
  .todo-item.done .txt { text-decoration: line-through; color: var(--ink3); }
  #todoCats { max-height: 168px; overflow-y: auto; overscroll-behavior: contain; }
  #todoCats::-webkit-scrollbar { width: 3px; }
  #todoCats::-webkit-scrollbar-thumb { background: #d0d0d4; border-radius: 2px; }

  .media { display: grid; gap: 8px; margin-top: 4px; }
  .media a {
    display: block; border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit;
    border: 1px solid var(--line); background: #fafafa;
  }
  .media .thumb { height: 88px; min-height: 72px; background-size: cover; background-position: center; border-radius: 10px 10px 0 0; }
  .media .meta { padding: 8px 10px; font-size: 12px; font-weight: 550; line-height: 1.35; }
  .media .meta span { display: block; font-size: 10px; color: var(--ink3); font-weight: 400; margin-top: 2px; }

  /* Mind secondary */
  .mind-list { display: flex; flex-direction: column; gap: 6px; }
  .mind-row {
    border: 1px solid var(--line); border-radius: 10px; background: #fafafa;
    overflow: hidden;
  }
  .mind-row summary {
    list-style: none; cursor: pointer; padding: 10px 12px;
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  }
  .mind-row summary::-webkit-details-marker { display: none; }
  .mind-row summary .chev { margin-left: auto; color: var(--ink3); font-size: 11px; transition: transform .15s; }
  .mind-row[open] summary .chev { transform: rotate(90deg); }
  .mind-row .mind-body { padding: 0 12px 12px; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
  .mind-row .mind-body li { list-style: none; padding: 4px 0; border-top: 1px solid var(--line); }
  .mind-row .mind-body li:first-child { border-top: none; }
  .mind-tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px;
    background: #efe8ff; color: #5b3cc4; margin-left: 6px; font-weight: 500;
  }

  /* slim Notion dock */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, rgba(243,241,248,0.92) 28%);
    display: flex; gap: 8px; align-items: center; justify-content: center;
  }
  .dock-bar {
    flex: 1; max-width: 520px; height: 40px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 12px;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .dock-bar .mods {
    display: flex; gap: 2px; align-items: center; overflow-x: auto;
    scrollbar-width: none;
  }
  .dock-bar .mods::-webkit-scrollbar { display: none; }
  .mod {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 14px;
    color: var(--ink2); position: relative;
  }
  .mod:hover, .mod.on { background: rgba(0,0,0,0.05); color: var(--ink); }
  .mod .badge {
    position: absolute; top: -2px; right: -2px;
    min-width: 14px; height: 14px; padding: 0 3px;
    background: #ff3b30; color: #fff; font-size: 9px; font-weight: 700;
    border-radius: 99px; display: grid; place-items: center;
  }
  .dock-sep { width: 1px; height: 18px; background: var(--line); flex-shrink: 0; }
  .dock-bar input { flex: 1; min-width: 60px; font-size: 13px; outline: none; height: 100%; }
  .dock-bar input::placeholder { color: var(--ink3); }
  .fab {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    background: #fff; border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    display: grid; place-items: center; font-size: 18px; color: var(--ink);
  }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(12px);
    bottom: calc(var(--dock-h) + 12px); z-index: 50;
    background: rgba(30,30,32,0.92); color: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
    max-width: min(360px, calc(100% - 24px));
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast.picking { bottom: calc(var(--dock-h) + 48px); }
  .toast-row { display: flex; align-items: center; gap: 8px; }
  .toast-picker { display: none; gap: 6px; margin-top: 8px; }
  .toast.picking .toast-picker { display: flex; }
  .toast-picker button {
    flex: 1; padding: 6px 0; border-radius: 8px; background: rgba(255,255,255,0.14);
    font-size: 12px; color: #fff;
  }
  .toast-picker button:hover { background: rgba(255,255,255,0.24); }
  .toast .chg { color: #7eb8ff; font-size: 12px; margin-left: auto; }


  .links-sheet {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,0.28);
    display: grid; place-items: end center;
    padding: 16px 16px calc(var(--dock-h) + 24px);
  }
  .links-sheet[hidden] { display: none !important; }
  .links-card {
    width: min(420px, 100%);
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(16px);
    border-radius: 16px; border: 1px solid var(--line);
    box-shadow: var(--shadow); padding: 14px;
  }
  .links-card header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
  .links-card header strong { font-size: 14px; }
  .links-card .ghost { font-size: 13px; color: var(--accent); padding: 4px 8px; }
  .links-list { display:flex; flex-direction:column; gap:6px; }
  .links-item {
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 14px; border-radius: 12px;
    background: #fafafa; border: 1px solid var(--line);
    text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 500;
  }
  .links-row { display:flex; align-items:center; gap:6px; }
  .links-row .links-item { flex:1; min-width:0; }
  .links-del {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    color: var(--ink3); font-size: 16px; line-height: 1;
  }
  .links-del:hover { background: #f0f0f2; color: var(--ink); }
  .links-add { display:flex; gap:6px; margin-top:10px; align-items:center; }
  .links-add input {
    flex:1; min-width:0; height:34px; padding:0 10px; border-radius:10px;
    background:#f4f4f6; font-size:13px; outline:none;
  }
  .links-add button {
    height:34px; padding:0 12px; border-radius:10px; flex-shrink:0;
    background:var(--accent); color:#fff; font-size:13px; font-weight:600;
  }


  /* R16 restrained doorplate motion */
  .dock-bar {
    position: relative;
    overflow: hidden;
    transition: transform .18s var(--ease), opacity .18s var(--ease);
  }
  .dock-bar::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: rgba(0,113,227,0.42);
    transform: scaleX(0); transform-origin: left center;
    opacity: 0; pointer-events: none;
  }
  .dock.pressing .dock-bar {
    transform: scale(0.98);
    opacity: 0.92;
  }
  .dock.pressing .dock-bar::after {
    opacity: 1;
    transform: scaleX(1);
    transition: transform .48s linear, opacity .1s linear;
  }
  .links-sheet {
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .links-sheet.open {
    opacity: 1;
    pointer-events: auto;
  }
  .links-sheet[hidden] { display: none !important; opacity: 0; }
  .links-card {
    transform: translateY(14px);
    transition: transform .2s var(--ease);
  }
  .links-sheet.open .links-card { transform: translateY(0); }
  .links-row {
    overflow: hidden;
    max-height: 64px;
    opacity: 1;
    transform: none;
    transition:
      opacity .18s var(--ease),
      max-height .2s var(--ease),
      margin .2s var(--ease),
      transform .18s var(--ease);
  }
  .links-row.entering {
    opacity: 0;
    max-height: 0;
    transform: translateY(6px);
  }
  .links-row.entering.in {
    opacity: 1;
    max-height: 64px;
    transform: none;
  }
  .links-row.removing {
    opacity: 0;
    max-height: 0;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    transform: scale(0.98);
    pointer-events: none;
  }
  .links-add input, .links-add button { height: 36px; }
  @media (prefers-reduced-motion: reduce) {
    .dock-bar,
    .dock.pressing .dock-bar,
    .dock-bar::after,
    .dock.pressing .dock-bar::after,
    .links-sheet,
    .links-card,
    .links-row {
      transition: none !important;
    }
    .dock.pressing .dock-bar { transform: none; opacity: 1; }
    .dock.pressing .dock-bar::after { opacity: 0; transform: scaleX(0); }
    .links-card { transform: none; }
    .links-row.entering { opacity: 1; max-height: 64px; transform: none; }
  }

  .foot { margin-top: 16px; font-size: 11px; color: var(--ink3); text-align: center; }
  .section-jump { scroll-margin-top: 12px; }

  @media (max-width: 899px) {
    .row .tags { display: none; }
    .group-label .pill { display: none; }
  }

  /* r11 — R20 overrides cover/dock */
  @media (max-width: 899px) {
    #sec-todo, #sec-clip { min-height: 0; }
  }
  /* r12 sticky capture subtle */
  .capture { transition: box-shadow .25s var(--ease), transform .25s var(--ease); }
  .capture:focus-within { box-shadow: 0 8px 28px rgba(0,113,227,0.18); transform: translateY(-1px); }
  .mod img { transition: transform .2s var(--ease); }
  .mod:active img { transform: scale(0.92); }
  /* r13 empty calm one-liner */
  .empty-line { color: var(--ink3); font-size: 12.5px; padding: 6px 0; }
  
  /* R17 wide density — desktop only; mobile 1fr 1fr untouched */
  @media (min-width: 900px) {
    .shell { max-width: 1280px; padding: 0 18px calc(var(--dock-h) + 20px); }
    .cover { height: 160px; }
    .capture { margin-top: -16px; }
    .grid {
      margin-top: 10px;
      grid-template-columns: 252px minmax(0, 1fr) 272px;
      gap: 8px;
    }
    .card { padding: 11px; border-radius: 12px; }
    .card + .card { margin-top: 8px; }
    .card h2 { margin-bottom: 7px; }
    .profile { gap: 8px; }
    .motto { margin-top: 7px; line-height: 1.45; }
    .motto li { padding: 1px 0; }
    .fat-stub { margin-top: 8px; padding: 7px 9px; }
    .quote { padding: 7px 9px; margin-bottom: 5px; font-size: 12px; line-height: 1.45; }
    .tabs { margin: 6px 0 8px; }
    .month-banner { padding: 7px 9px; margin-bottom: 6px; }
    .group-label { padding: 7px 0 4px; margin-top: 4px; }
    .row { padding: 5px 2px; }
    .cat { margin-bottom: 8px; }
    .todo-item { padding: 4px 0; }
    /* desktop: show more todos — lift mobile-only 168px clamp */
    #todoCats { max-height: none; overflow: visible; }
    .media { gap: 6px; margin-top: 2px; }
    .media .thumb { height: 72px; min-height: 64px; }
    .media .meta { padding: 6px 8px; }
    .mind-list { gap: 5px; }
    .mind-row summary { padding: 8px 10px; }
    .mind-row .mind-body { padding: 0 10px 10px; }
    .foot { margin-top: 12px; }
  }
  @media (min-width: 1180px) {
    .grid {
      grid-template-columns: 268px minmax(0, 1fr) 300px;
      gap: 9px;
    }
  }

  /* r13 hover reveal density on desktop */
  @media (hover:hover) {
    .row .tags { opacity: 0.55; transition: opacity .15s; }
    .row:hover .tags { opacity: 1; }
  }


  /* R16 first-open door breath on real doorplate (.dock-bar) — no copy */
  .dock-bar.breathe {
    animation: doorBreath 1.15s var(--ease) 1;
  }
  @keyframes doorBreath {
    0%, 100% { opacity: 1; transform: scale(1); }
    35% { opacity: 0.78; transform: scale(1.018); }
    65% { opacity: 0.92; transform: scale(1.01); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dock-bar.breathe { animation: none; }
  }

  /* R17 acceptance: left stack / mid duo / right fill */
  .col-mid { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .col-mid > #sec-month { margin: 0; }

<script>
(() => {
  const KEY = "personal-hub-v9";
  const FEW = "personal-hub-fewshot-v9";
  const LINKS_KEY = "personal-hub-links-v1";

  const SECTIONS = [

    { sec: "side", ico: "✍️", t: "写一篇短文", tags: [["side","副业"],["ai","创造"]], done: false },
    { sec: "life", ico: "🏃", t: "每周运动两次", tags: [["life","生活"]], done: false },
    { sec: "life", ico: "🧹", t: "收拾一次书桌", tags: [["life","生活"]], done: false },
  ];

  const SEED_CATS = ["📌 收件", "💻 工作", "🌟 生活", "🤖 学习"];
  const TODO_SEED = {

    { title: "Dusk", thumb: "./assets/clip-c.svg", href: "https://www.pinterest.com/search/pins/?q=dusk" },
    { title: "Light", thumb: "./assets/clip-d.svg", href: "https://www.pinterest.com/search/pins/?q=light" },
  ];

  const QUOTES_SEED = [
    { text: "少一点，但做好一点。", color: "tan" },
    { text: "先开始，再完美。", color: "pink" },
    { text: "今天的小事，就是明天的底气。", color: "blue" },
    { text: "记下来，脑子就空出来了。", color: "green" },
  ];
  const QUOTE_COLORS = ["tan", "pink", "blue", "green"];

  const MIND_SEED = [
    {
      title: "喜欢的摘录", ico: "📜",
      items: ["慢慢来，比较快。", "把复杂留给自己，把简单留给用的人。", "好的工具，用完就忘了它在。"]
    },
    {
      title: "Future", ico: "💭",
      items: ["学习 · 一门新技能", "工作 · 一个小项目上线", "生活 · 一次短途旅行"]
    },
    {
      title: "热爱清单", ico: "🫶",
      items: ["📚 读完一本书 · Done", "🏃 每周跑步两次 · In progress", "🎧 整理一个歌单 · Done", "🌱 养活一盆绿植 · In progress"]
    },
  ];

  const MOTTO_SEED = ["先记下，再整理", "一次只做一件事"];

  const LINKS_SEED = [
    { name: "Notion", url: "https://www.notion.so/" },
    { name: "Pinterest", url: "https://www.pinterest.com/" },
    { name: "GitHub", url: "https://github.com/" },
  ];

  const PROFILE_SEED = { name: "我的桌面", role: "Orbit Desk" };

  const MODULES = {
    todo:  { sec: "sec-todo",  name: "待办" },
    clip:  { sec: "sec-clip",  name: "剪藏" },
    week:  { sec: "sec-week",  name: "本周" },
    month: { sec: "sec-month", name: "月计划" },
    quote: { sec: "sec-quote", name: "提醒" },
    mind:  { sec: "sec-mind",  name: "Mind" },
    note:  { sec: "sec-note",  name: "小记" },
    spark: { sec: "sec-spark", name: "灵感墙" },
  };
  const SEC_TO_MOD = Object.fromEntries(Object.entries(MODULES).map(([k, v]) => [v.sec, k]));

  const EMPTY_DEMO = new URLSearchParams(location.search).get("empty") === "1";
  let state = load();
  let lastId = null;
  let toastTimer = null;
  let undoBag = null;
  let editingEl = null;
  let editOrig = "";
  let editCat = null;

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function seedTodos() {
    const todos = [];
    Object.entries(TODO_SEED).forEach(([cat, items]) => {
      items.forEach(t => todos.push({ id: uid(), text: t, cat, done: false, kind: "todo", date: ymd(new Date()) }));
    });
    return todos;
  }
  function ymd(d) {
    const x = d instanceof Date ? d : new Date(d);
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  }
  function startOfWeek(d = new Date()) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay();
    x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
    return x;
  }
  function weekDays() {
    const start = startOfWeek();
    const today = ymd(new Date());
    return ["一","二","三","四","五","六","日"].map((lab, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const date = ymd(d);
      return { label: lab, date, dayNum: d.getDate(), isToday: date === today };
    });
  }
  function todayYmd() { return ymd(new Date()); }
  function seedWeekTodos() {
    // a few dated todos on other days this week so the strip isn't blank
    const days = weekDays().filter(d => !d.isToday);
    const pick = i => days[Math.min(i, days.length - 1)].date;
    return [
      { id: uid(), text: "整理本周节奏", cat: "💻 工作", date: pick(0), done: false, kind: "todo" },
      { id: uid(), text: "交初稿", cat: "💻 工作", date: pick(3), done: false, kind: "todo" },
      { id: uid(), text: "周末大扫除", cat: "🌟 生活", date: pick(5), done: false, kind: "todo" },
    ];
  }
  let selectedWeekDay = ymd(new Date());

  function seedFull() {
    return {
      todos: [...seedTodos(), ...seedWeekTodos()],
      notes: [
        { id: uid(), text: "https://www.notion.so 晚点细看", kind: "note" },
        { id: uid(), text: "会议纪要：只留决策和负责人", kind: "note" },
        { id: uid(), text: "地铁上听到一句话，莫名戳中", kind: "note" },
      ],
      sparks: [
        { id: uid(), text: "要不要把书桌挪到窗边", kind: "spark" },
        { id: uid(), text: "突然想养一盆慢的绿植", kind: "spark" },
        { id: uid(), text: "周末去哪玩？顺便买票", kind: "spark" },
        { id: uid(), text: "🔥", kind: "spark" },
      ],
      month: MONTH_SEED.map(x => ({ ...x, id: uid() })),
      profile: { ...PROFILE_SEED },
      mottos: MOTTO_SEED.map(t => ({ id: uid(), text: t })),
      quotes: QUOTES_SEED.map(q => ({ id: uid(), text: q.text, color: q.color })),
      clips: CLIPS_SEED.map(c => ({ id: uid(), title: c.title, thumb: c.thumb, href: c.href })),
      mind: MIND_SEED.map(s => ({
        id: uid(), title: s.title, ico: s.ico,
        items: s.items.map(t => ({ id: uid(), text: t }))
      })),
      monthBanner: `${new Date().getMonth()+1} 月 · 少一点，做好一点`,
      hidden: [],
      todoCats: [...SEED_CATS],
      _v: 5,
    };
  }

  function migrate(raw) {
    if (!raw || typeof raw !== "object") return seedFull();
    if (!Array.isArray(raw.todos)) raw.todos = [];
    if (!Array.isArray(raw.notes)) raw.notes = [];
    if (!Array.isArray(raw.sparks)) raw.sparks = [];
    if (!Array.isArray(raw.month)) raw.month = [];
    // v3: todos are the single source of truth; each carries a date
    const t0 = ymd(new Date());
    raw.todos.forEach(t => { if (!t.date || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) t.date = t0; if (!t.kind) t.kind = "todo"; });
    if (Array.isArray(raw.weekItems)) {
      const have = new Set(raw.todos.map(t => t.id));
      raw.weekItems.forEach(w => {
        if (!w || !String(w.text || "").trim()) return;
        const id = w.id && !have.has(w.id) ? w.id : uid();
        raw.todos.push({ id, text: w.text, cat: "📌 收件", date: w.date || t0, done: !!w.done, kind: "todo" });
      });
    }
    delete raw.weekItems;
    // v8/v9: undoned past todos roll to today; rolledFrom = original start day (set once, never overwrite)
    raw.todos.forEach(t => {
      if (t.done) return;
      if (!t.date || t.date >= t0) return;
      if (!t.rolledFrom) t.rolledFrom = t.date;
      t.date = t0;
    });
    if (!raw.profile) raw.profile = { ...PROFILE_SEED };
    if (!Array.isArray(raw.mottos)) raw.mottos = MOTTO_SEED.map(t => ({ id: uid(), text: t }));
    if (!Array.isArray(raw.quotes)) raw.quotes = QUOTES_SEED.map(q => ({ id: uid(), text: q.text, color: q.color }));
    if (!Array.isArray(raw.clips)) raw.clips = CLIPS_SEED.map(c => ({ id: uid(), title: c.title, thumb: c.thumb, href: c.href }));
    if (!Array.isArray(raw.mind)) {
      raw.mind = MIND_SEED.map(s => ({
        id: uid(), title: s.title, ico: s.ico,
        items: s.items.map(t => ({ id: uid(), text: t }))
      }));
    } else {
      raw.mind.forEach(s => {
        if (!s.id) s.id = uid();
        if (!Array.isArray(s.items)) s.items = [];
        s.items.forEach(it => { if (typeof it === "string") { /* legacy */ } });
        s.items = s.items.map(it => typeof it === "string" ? { id: uid(), text: it } : (it.id ? it : { id: uid(), text: it.text || "" }));
      });
    }
    if (!Array.isArray(raw.hidden)) raw.hidden = [];
    if (!Array.isArray(raw.todoCats)) raw.todoCats = [...SEED_CATS];
    if (typeof raw.monthBanner !== "string") {
      raw.monthBanner = `${new Date().getMonth()+1} 月 · 少一点，做好一点`;
    }
    const nonEmpty = a => a.filter(x => String(x.text ?? x.t ?? x.title ?? "").trim());
    ["todos","notes","sparks","quotes","mottos","clips"].forEach(k => raw[k] = nonEmpty(raw[k]));
    raw.month = raw.month.filter(x => String(x.t || "").trim());
    raw.mind.forEach(sec => sec.items = nonEmpty(sec.items));
    raw._v = 5;
    return raw;
  }

  function emptyState() {
    return {
      todos: [], notes: [], sparks: [], month: [],
      profile: { ...PROFILE_SEED },
      mottos: [], quotes: [], clips: [], mind: [],
      monthBanner: `${new Date().getMonth()+1} 月 · 少一点，做好一点`,
      hidden: [],
      todoCats: [...SEED_CATS],
      _v: 5,
    };
  }

  function load() {
    if (EMPTY_DEMO) return emptyState();
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (raw && Array.isArray(raw.todos) && Array.isArray(raw.month)) {
        const m = migrate(raw);
        // persist rollover / migrations immediately so next open and storage stay in sync
        try { localStorage.setItem(KEY, JSON.stringify(m)); } catch {}
        return m;
      }
    } catch {}
    return seedFull();
  }

  function save() {
    if (EMPTY_DEMO) return;
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function looksLikeUrl(raw) {
    const t = String(raw || "").trim().toLowerCase();
    return /https?:\/\//i.test(raw) || /\bwww\./i.test(t) || /\b[\w-]+\.(com|cn|io|app|dev|net|org|pro|me|co)(\/\S*)?\b/i.test(raw);
  }
  function classify(raw) {
    raw = String(raw || "").trim();
    let few = {};
    try { few = JSON.parse(localStorage.getItem(FEW) || "{}"); } catch {}
    if (few[raw]) return few[raw];
    if (looksLikeUrl(raw)) return "note";
    if (/\p{Extended_Pictographic}/u.test(raw) && /^[\p{Extended_Pictographic}\p{Emoji_Presentation}\uFE0F\s]+$/u.test(raw)) return "spark";
    if (/[？?]/.test(raw)) return "spark";
    if (/^(要不要|要不要去|去不去|要不要试试)/.test(raw) || /去哪|怎么办|什么好|好不好/.test(raw)) return "spark";
    if (/记得买/.test(raw) || /买票|买菜|买咖啡|买牛奶/.test(raw) || /^(买|要买|去买|顺便买)/.test(raw) || /(^|[\s，,])买/.test(raw)) return "todo";
    if (/明天|后天|今晚|下周/.test(raw) && /(看|做|交|写|回|处理)/.test(raw) && !/[？?]/.test(raw)) return "todo";
    return "todo";
  }
  const BARE_CAT_LABELS = ["收件", "工作", "生活", "学习"];
  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function resolveCatTitles() {
    const titles = [...(state.todoCats && state.todoCats.length ? state.todoCats : SEED_CATS)];
    state.todos.forEach(t => {
      const c = t.cat || "📌 收件";
      if (!titles.includes(c)) titles.push(c);
    });
    return titles;
  }
  /** If text starts with a known category + ：/: , return { cat, text } (stripped). Null for URLs. */
  function parseCatPrefix(raw) {
    raw = String(raw || "").trim();
    if (!raw || looksLikeUrl(raw)) return null;
    const titles = resolveCatTitles();
    const aliases = [];
    titles.forEach(c => {
      aliases.push([c, c]);
      const bare = c.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u, "").trim();
      if (bare) aliases.push([bare, c]);
    });
    BARE_CAT_LABELS.forEach((b, i) => {
      const cat = (state.todoCats && state.todoCats[i]) || SEED_CATS[i];
      aliases.push([b, cat]);
    });
    aliases.sort((a, b) => b[0].length - a[0].length);
    const seen = new Set();
    for (const [label, cat] of aliases) {
      if (!label || seen.has(label)) continue;
      seen.add(label);
      const m = raw.match(new RegExp("^" + escapeRe(label) + "\\s*[：:]\\s*(.*)$"));
      if (m) return { cat, text: (m[1] || "").trim() };
    }
    return null;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  }

  function greeting() {
    const h = new Date().getHours();
    let g = "你好";
    if (h < 5) g = "夜深了";
    else if (h < 11) g = "早上好";
    else if (h < 14) g = "中午好";
    else if (h < 18) g = "下午好";
    else g = "晚上好";
    const el = document.getElementById("greetingSub");
    if (el && !el.classList.contains("editing")) {
      el.textContent = `Orbit Desk · ${g} · 先看今日`;
    }
  }

  function emptyLine() {
    return '<div class="empty-line">今天还没写</div>';
  }

  function delBtn(bag, id, extra) {
    return `<button type="button" class="item-del" data-del="${bag}" data-id="${id}"${extra ? " " + extra : ""} aria-label="删除">×</button>`;
  }

  function renderProfile() {
    const n = document.getElementById("profileName");
    const r = document.getElementById("profileRole");
    if (n && !n.classList.contains("editing")) n.textContent = state.profile.name || PROFILE_SEED.name;
    if (r && !r.classList.contains("editing")) r.textContent = state.profile.role || PROFILE_SEED.role;
    const el = document.getElementById("mottoList");
    if (!el) return;
    if (!state.mottos.length) { el.innerHTML = ""; return; }
    el.innerHTML = state.mottos.map(m => `
      <li class="swipeable" data-bag="motto" data-id="${m.id}">
        <span class="txt editable" data-edit="motto" data-id="${m.id}">${esc(m.text)}</span>
        ${delBtn("motto", m.id)}
      </li>`).join("");
  }

  function renderQuotes() {
    const el = document.getElementById("quoteList");
    if (!el) return;
    if (!state.quotes.length) { el.innerHTML = emptyLine(); return; }
    el.innerHTML = state.quotes.map(q => `
      <div class="quote-item swipeable" data-bag="quote" data-id="${q.id}">
        <div class="quote ${esc(q.color || "tan")} editable" data-edit="quote" data-id="${q.id}">${esc(q.text)}</div>
        ${delBtn("quote", q.id)}
      </div>`).join("");
  }

  function weekEmptyLine() {
    return '<div class="empty-line">还没写</div>';
  }
  function renderWeek() {
    const days = weekDays();
    if (!days.some(d => d.date === selectedWeekDay)) selectedWeekDay = (days.find(d => d.isToday) || days[0]).date;
    const strip = document.getElementById("weekStrip");
    const list = document.getElementById("weekList");
    if (!strip || !list) return;
    strip.innerHTML = days.map(d => {
      const open = todosOn(d.date).filter(t => !t.done).length;
      const cls = ["week-day", d.isToday ? "today" : "", d.date === selectedWeekDay ? "on" : ""].filter(Boolean).join(" ");
      const dot = open ? `<span class="wd-dot">${open > 9 ? "9+" : open}</span>` : "";
      return `<button type="button" class="${cls}" data-week-day="${d.date}" role="tab" aria-selected="${d.date === selectedWeekDay}" title="${d.date}">${dot}<span class="wd-lab">${d.label}</span><span class="wd-num">${d.dayNum}</span></button>`;
    }).join("");
    const isToday = selectedWeekDay === todayYmd();
    const dayList = todosOn(selectedWeekDay);
    const dayGhosts = isToday ? [] : ghostsOn(selectedWeekDay);
    list.innerHTML = todoGroupsHtml(dayList, selectedWeekDay, { allSeed: isToday, empty: weekEmptyLine(), ghosts: dayGhosts });
    const inWeek = new Set(days.map(d => d.date));
    const weekOpen = state.todos.filter(t => inWeek.has(t.date || todayYmd()) && !t.done).length;
    const wc = document.getElementById("weekCount");
    if (wc) wc.textContent = weekOpen;
    // keep today (or selected) roughly in view on mobile strip
    requestAnimationFrame(() => {
      const on = strip.querySelector(".week-day.on");
      if (on) try { on.scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" }); } catch {}
    });
  }
  function renderMonth() {
    const banner = document.getElementById("monthBanner");
    if (banner && !banner.classList.contains("editing")) {
      banner.textContent = state.monthBanner || `${new Date().getMonth()+1} 月 · 少一点，做好一点`;
    }
    const el = document.getElementById("monthList");
    el.innerHTML = SECTIONS.map(sec => {
      const items = state.month.filter(it => it.sec === sec.key);
      if (!items.length) return "";
      return `
        <div class="group-label">${sec.ico} ${sec.label} <span class="pill tag ${sec.pill}">${sec.label}</span></div>
        ${items.map(it => `
          <div class="row ${it.done ? "done" : ""} swipeable" data-bag="month" data-id="${it.id}">
            <div class="ico">${it.ico || "•"}</div>
            <div class="body">
              <div class="t editable" data-edit="month" data-id="${it.id}">${esc(it.t)}</div>
              <div class="tags">${(it.tags||[]).map(([k,l]) => `<span class="tag ${k}">${esc(l)}</span>`).join("")}</div>
            </div>
            ${delBtn("month", it.id)}
            <button type="button" class="check ${it.done ? "on" : ""}" data-month="1" aria-label="完成"></button>
          </div>`).join("")}`;
    }).join("") || emptyLine();
  }

  function todoCatKeys(list) {
    const keys = [...(state.todoCats || [])];
    (list || state.todos).forEach(t => { const c = t.cat || "📌 收件"; if (!keys.includes(c)) keys.push(c); });
    return keys;
  }
  function todosOn(date) { return state.todos.filter(t => (t.date || todayYmd()) === date); }
  /** Todos that rolled away from this date — faded non-interactive traces in 本周. */
  function ghostsOn(date) {
    return state.todos.filter(t => t.rolledFrom === date && (t.date || todayYmd()) !== date);
  }
  /* one grouped renderer for 今日待办 and 本周 — same headings, ＋, rows */
  function todoGroupsHtml(list, date, { allSeed, empty, ghosts }) {
    ghosts = ghosts || [];
    const cats = {};
    list.forEach(t => { const c = t.cat || "📌 收件"; (cats[c] = cats[c] || []).push(t); });
    const ghostCats = {};
    ghosts.forEach(t => { const c = t.cat || "📌 收件"; (ghostCats[c] = ghostCats[c] || []).push(t); });
    let keys = todoCatKeys(list.length || ghosts.length ? [...list, ...ghosts] : list);
    if (!allSeed) keys = keys.filter(c => c === "📌 收件" || (cats[c] && cats[c].length) || (ghostCats[c] && ghostCats[c].length));
    const hasAny = list.length || ghosts.length;
    return (hasAny ? "" : empty) + keys.map(c => `
      <div class="cat" data-catbox="${esc(c)}">
        <div class="cat-hrow">
          <div class="cat-h editable" data-edit="cat" data-cat="${esc(c)}">${esc(c)}</div>
          <button type="button" class="cat-add" data-add-cat="${esc(c)}" data-date="${date}" aria-label="添加" title="添加">＋</button>
        </div>
        ${(cats[c] || []).map(t => `
          <div class="todo-item ${t.done ? "done" : ""} swipeable" data-bag="todo" data-id="${t.id}">
            <button type="button" class="check ${t.done ? "on" : ""}" data-todo="1"></button>
            <div class="txt editable" data-edit="todo" data-id="${t.id}">${esc(t.text)}</div>
            ${delBtn("todo", t.id)}
          </div>`).join("")}
        ${(ghostCats[c] || []).map(t => `
          <div class="todo-item todo-ghost" data-ghost="${t.id}" aria-hidden="true">
            <span class="ghost-mark" aria-hidden="true"></span>
            <div class="txt">${esc(t.text)}</div>
          </div>`).join("")}
      </div>`).join("");
  }
  function renderTodos() {
    const today = todayYmd();
    const list = todosOn(today);
    document.getElementById("todoCats").innerHTML = todoGroupsHtml(list, today, { allSeed: true, empty: emptyLine() });
    document.getElementById("todoCount").textContent = list.filter(t => !t.done).length;
  }

  function renderNotesSparks() {
    document.getElementById("noteList").innerHTML = state.notes.map(n =>
      `<div class="todo-item swipeable" style="font-size:12.5px" data-bag="note" data-id="${n.id}">
        <div class="txt editable" data-edit="note" data-id="${n.id}">${esc(n.text)}</div>
        ${delBtn("note", n.id)}
      </div>`).join("") || emptyLine();
    document.getElementById("sparkList").innerHTML = state.sparks.map(n =>
      `<div class="todo-item swipeable" style="font-size:12.5px" data-bag="spark" data-id="${n.id}">
        <div class="txt editable" data-edit="spark" data-id="${n.id}">${esc(n.text)}</div>
        ${delBtn("spark", n.id)}
      </div>`).join("") || emptyLine();
    document.getElementById("noteCount").textContent = state.notes.length;
    document.getElementById("sparkCount").textContent = state.sparks.length;
    const bn = document.getElementById("bNote"), bs = document.getElementById("bSpark");
    bn.hidden = !state.notes.length; bn.textContent = Math.min(state.notes.length, 9);
    bs.hidden = !state.sparks.length; bs.textContent = Math.min(state.sparks.length, 9);
  }

  function renderClips() {
    const el = document.getElementById("clipList");
    if (!el) return;
    if (!state.clips.length) { el.innerHTML = emptyLine(); return; }
    el.innerHTML = state.clips.map(c => `
      <div class="clip swipeable" data-bag="clip" data-id="${c.id}">
        <span class="thumb" style="background-image:url(${esc(c.thumb || "./assets/clip-a.svg")})"></span>
        <div class="meta-row">
          <span class="meta editable" data-edit="clip" data-id="${c.id}">${esc(c.title || "")}</span>
          <button type="button" class="clip-open" data-href="${esc(c.href || "")}" aria-label="打开链接">↗</button>
          ${delBtn("clip", c.id)}
        </div>
        <div class="clip-url editable" data-edit="clip-url" data-id="${c.id}">${esc(c.href || "")}</div>
      </div>`).join("");
  }

  function renderMind() {
    const el = document.getElementById("mindList");
    if (!el) return;
    if (!state.mind.length) { el.innerHTML = emptyLine(); return; }
    el.innerHTML = state.mind.map(sec => `
      <details class="mind-row" open data-mind-sec="${sec.id}">
        <summary>
          <span class="editable" data-edit="mind-title" data-id="${sec.id}">${esc((sec.ico || "") + " " + (sec.title || "")).trim() || "分组"}</span>

        </summary>
        <div class="mind-body">
          <ul>
            ${(sec.items || []).map(it => `
              <li class="mind-li swipeable" data-bag="mind-item" data-id="${it.id}" data-sec="${sec.id}">
                <span class="txt editable" data-edit="mind-item" data-id="${it.id}" data-sec="${sec.id}">${esc(it.text)}</span>
                ${delBtn("mind-item", it.id, `data-sec="${sec.id}"`)}
              </li>`).join("")}
          </ul>
        </div>
      </details>`).join("");
  }

  function loadLinks() {
    try {
      const raw = JSON.parse(localStorage.getItem(LINKS_KEY) || "null");
      if (Array.isArray(raw)) return raw.map((x, i) => ({ id: x.id || ("L" + i), name: x.name, url: x.url }));
    } catch {}
    return LINKS_SEED.map(x => ({ ...x, id: uid() }));
  }
  function saveLinks(list) {
    if (EMPTY_DEMO) return;
    localStorage.setItem(LINKS_KEY, JSON.stringify(list));
  }
  let linksCache = null;
  function getLinks() {
    if (!linksCache) linksCache = loadLinks();
    return linksCache;
  }
  function renderLinks() {
    const list = getLinks();
    const el = document.getElementById("linksList");
    if (!el) return;
    el.innerHTML = list.map((L, i) => `
      <div class="links-row swipeable" data-bag="link" data-id="${L.id}">
        <a class="links-item" href="${esc(L.url)}" target="_blank" rel="noopener">
          <span class="editable" data-edit="link-name" data-id="${L.id}">${esc(L.name)}</span>
          <span>↗</span>
        </a>
        <button type="button" class="item-del links-del" data-del="link" data-id="${L.id}" aria-label="删">×</button>
      </div>`).join("");
  }

  let toastAction = null;
  function toast({ msg, change = false, action = null, ms = 4200 }) {
    const t = document.getElementById("toast");
    t.classList.remove("picking");
    t.classList.toggle("undo-mode", !change);
    document.getElementById("toastMsg").textContent = msg;
    document.getElementById("toastChange").hidden = !change;
    const btn = document.getElementById("toastUndo");
    toastAction = action;
    btn.hidden = !action;
    if (action) btn.textContent = action.label;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      t.classList.remove("show", "picking", "undo-mode");
      toastAction = null; undoBag = null;
    }, ms);
  }
  function showToast(kind, id) {
    lastId = id;
    undoBag = null;
    const mk = kind; // todo/note/spark share module keys
    if (state.hidden.includes(mk)) {
      toast({ msg: `${MODULES[mk].name}已收起 ·`, change: true, ms: 5000,
        action: { label: "恢复", fn: () => { showModule(mk); const el = document.getElementById(MODULES[mk].sec); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); } } });
      return;
    }
    const map = { todo: "→ 今日待办", note: "→ 小记", spark: "→ 灵感" };
    toast({ msg: map[kind] || "→", change: true });
  }
  function showUndoToast() {
    toast({ msg: "已删除 ·", ms: 5000, action: { label: "撤销", fn: () => { if (undoBag) restoreRemoved(undoBag); undoBag = null; } } });
  }
  function showHideToast() {
    toast({ msg: "已收起 ·", ms: 5000, action: { label: "恢复", fn: () => { if (undoBag) restoreRemoved(undoBag); undoBag = null; } } });
  }

  function addItem(text, kind, cat) {
    const id = uid();
    if (kind === "todo") state.todos.unshift({ id, text, cat: cat || "📌 收件", date: todayYmd(), done: false, kind });
    else if (kind === "note") state.notes.unshift({ id, text, kind });
    else state.sparks.unshift({ id, text, kind });
    save(); paint(); showToast(kind, id);
  }
  function captureText(raw) {
    const text = String(raw || "").trim();
    if (!text) return;
    const pref = parseCatPrefix(text);
    if (pref) { addItem(pref.text, "todo", pref.cat); return; }
    addItem(text, classify(text));
  }

  function applyHidden() {
    Object.entries(MODULES).forEach(([k, m]) => {
      const el = document.getElementById(m.sec);
      if (el) el.hidden = state.hidden.includes(k);
    });
  }
  function hideModule(k) {
    if (!MODULES[k] || state.hidden.includes(k)) return false;
    state.hidden.push(k); return true;
  }
  function showModule(k) {
    state.hidden = state.hidden.filter(x => x !== k);
    save(); applyHidden();
  }
  function paint() {
    applyHidden();
    renderProfile();
    renderQuotes();
    renderMonth();
    renderWeek();
    renderTodos();
    renderNotesSparks();
    renderClips();
    renderMind();
    renderLinks();
  }

  /* —— edit —— */
  function editKey(el) {
    if (el.id) return "#" + CSS.escape(el.id);
    let sel = `[data-edit="${el.dataset.edit}"]`;
    if (el.dataset.id) sel += `[data-id="${CSS.escape(el.dataset.id)}"]`;
    if (el.dataset.cat) sel += `[data-cat="${CSS.escape(el.dataset.cat)}"]`;
    const scope = el.closest("#weekList") ? "#weekList " : el.closest("#todoCats") ? "#todoCats " : "";
    return scope + sel;
  }
  function removeChips() {
    document.querySelectorAll(".cat-chips").forEach(c => {
      c.parentElement && c.parentElement.classList.remove("has-chips"); c.remove();
    });
  }
  function showChips(el) {
    const it = state.todos.find(x => x.id === el.dataset.id);
    const row = el.closest(".todo-item");
    if (!it || !row) return;
    editCat = it.cat || "📌 收件";
    const box = document.createElement("div");
    box.className = "cat-chips";
    box.innerHTML = todoCatKeys(state.todos).map(c =>
      `<button type="button" class="cat-chip${c === editCat ? " on" : ""}" data-chip="${esc(c)}" tabindex="-1">${esc(c)}</button>`).join("");
    row.classList.add("has-chips");
    row.appendChild(box);
  }
  function beginEdit(el) {
    if (!el || el.classList.contains("editing")) return;
    if (editingEl && editingEl !== el) {
      const key = editKey(el);
      commitEdit(true);
      if (!el.isConnected) el = document.querySelector(key);
      if (!el) return;
    }
    editingEl = el;
    editOrig = el.textContent;
    editCat = null;
    el.contentEditable = "true";
    el.classList.add("editing");
    if (el.dataset.edit === "todo") showChips(el);
    el.focus();
    try {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch {}
  }

  function commitEdit(saveIt) {
    if (!editingEl) return;
    const el = editingEl;
    const text = el.textContent.replace(/\u00a0/g, " ").trim();
    const kind = el.dataset.edit;
    const id = el.dataset.id;
    el.contentEditable = "false";
    el.classList.remove("editing");
    editingEl = null;
    const chosenCat = editCat; editCat = null;
    removeChips();

    if (!saveIt) {
      if (el.dataset.new === "1") { deleteByRef(kind, id, el.dataset.sec); return; }
      el.textContent = editOrig;
      return;
    }

    // discard empty new items
    if (el.dataset.new === "1" && !text) {
      deleteByRef(kind, id, el.dataset.sec);
      paint();
      return;
    }

    if (kind === "profile.name") {
      state.profile.name = text || PROFILE_SEED.name;
      el.textContent = state.profile.name;
    } else if (kind === "profile.role") {
      state.profile.role = text || PROFILE_SEED.role;
      el.textContent = state.profile.role;
    } else if (kind === "monthBanner") {
      state.monthBanner = text || state.monthBanner;
      el.textContent = state.monthBanner;
    } else if (kind === "todo") {
      const it = state.todos.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("todo", id); return; } it.text = text; if (chosenCat) it.cat = chosenCat; }
    } else if (kind === "note") {
      const it = state.notes.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("note", id); return; } it.text = text; }
    } else if (kind === "spark") {
      const it = state.sparks.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("spark", id); return; } it.text = text; }
    } else if (kind === "month") {
      const it = state.month.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("month", id); return; } it.t = text; }
    } else if (kind === "quote") {
      const it = state.quotes.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("quote", id); return; } it.text = text; }
    } else if (kind === "motto") {
      const it = state.mottos.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("motto", id); return; } it.text = text; }
    } else if (kind === "clip-url") {
      const it = state.clips.find(x => x.id === id);
      if (it && text) it.href = /^[a-z][\w+.-]*:\/\//i.test(text) ? text : "https://" + text;
    } else if (kind === "clip") {
      const it = state.clips.find(x => x.id === id);
      if (it) { if (!text) { deleteItem("clip", id); return; } it.title = text; }
    } else if (kind === "mind-item") {
      const sec = state.mind.find(s => s.id === el.dataset.sec);
      const it = sec && (sec.items || []).find(x => x.id === id);
      if (it) { if (!text) { deleteItem("mind-item", id, el.dataset.sec); return; } it.text = text; }
    } else if (kind === "mind-title") {
      const sec = state.mind.find(s => s.id === id);
      if (sec) {
        // keep leading emoji as ico if present
        const m = text.match(/^(\p{Extended_Pictographic})\s*(.*)$/u);
        if (m) { sec.ico = m[1]; sec.title = m[2] || sec.title; }
        else { sec.title = text || sec.title; }
      }
    } else if (kind === "cat") {
      const oldCat = el.dataset.cat;
      if (text && text !== oldCat) {
        state.todos.forEach(t => { if (t.cat === oldCat) t.cat = text; });
        const tc = state.todoCats || (state.todoCats = []);
        const i = tc.indexOf(oldCat);
        if (i >= 0) { if (tc.includes(text)) tc.splice(i, 1); else tc[i] = text; }
      } else if (!text) el.textContent = oldCat;
    } else if (kind === "link-name") {
      const list = getLinks();
      const it = list.find(x => x.id === id);
      if (it) { it.name = text || it.name; saveLinks(list); }
    }
    save();
    // avoid full repaint while focusing — light update counts
    if (["todo","note","spark","month","quote","motto","clip","clip-url","mind-item","mind-title","cat"].includes(kind)) {
      // repaint to sync structure; re-find not needed
      const selId = id;
      const selKind = kind;
      paint();
      // no re-focus after save
    }
  }

  function deleteByRef(kind, id, secId) {
    if (kind === "todo" || kind === "note" || kind === "spark" || kind === "month" || kind === "quote" || kind === "motto" || kind === "clip") {
      deleteItem(kind, id, secId, true);
    } else if (kind === "mind-item") {
      deleteItem("mind-item", id, secId, true);
    }
  }

  function findAndRemove(bag, id, secId) {
    let removed = null, meta = { bag, id, secId };
    if (bag === "todo") {
      const i = state.todos.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.todos.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "note") {
      const i = state.notes.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.notes.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "spark") {
      const i = state.sparks.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.sparks.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "month") {
      const i = state.month.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.month.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "quote") {
      const i = state.quotes.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.quotes.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "motto") {
      const i = state.mottos.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.mottos.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "clip") {
      const i = state.clips.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.clips.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "mind-item") {
      const sec = state.mind.find(s => s.id === secId);
      if (sec) {
        const i = sec.items.findIndex(x => x.id === id);
        if (i >= 0) { removed = sec.items.splice(i, 1)[0]; meta.index = i; meta.secId = secId; }
      }
    } else if (bag === "mind") {
      const i = state.mind.findIndex(x => x.id === id);
      if (i >= 0) { removed = state.mind.splice(i, 1)[0]; meta.index = i; }
    } else if (bag === "module") {
      if (hideModule(id)) removed = { key: id };
    } else if (bag === "link") {
      const list = getLinks();
      const i = list.findIndex(x => x.id === id);
      if (i >= 0) { removed = list.splice(i, 1)[0]; meta.index = i; saveLinks(list); linksCache = list; }
    }
    return removed ? { removed, meta } : null;
  }

  function restoreRemoved(pack) {
    if (!pack) return;
    const { removed, meta } = pack;
    const i = meta.index ?? 0;
    const bag = meta.bag;
    if (bag === "todo") state.todos.splice(i, 0, removed);
    else if (bag === "note") state.notes.splice(i, 0, removed);
    else if (bag === "spark") state.sparks.splice(i, 0, removed);
    else if (bag === "month") state.month.splice(i, 0, removed);
    else if (bag === "quote") state.quotes.splice(i, 0, removed);
    else if (bag === "motto") state.mottos.splice(i, 0, removed);
    else if (bag === "clip") state.clips.splice(i, 0, removed);
    else if (bag === "mind-item") {
      const sec = state.mind.find(s => s.id === meta.secId);
      if (sec) sec.items.splice(i, 0, removed);
    } else if (bag === "mind") state.mind.splice(i, 0, removed);
    else if (bag === "module") { showModule(removed.key); }
    else if (bag === "link") {
      const list = getLinks();
      list.splice(i, 0, removed);
      saveLinks(list); linksCache = list;
    }
    save(); paint();
  }

  function deleteItem(bag, id, secId, silent) {
    const pack = findAndRemove(bag, id, secId);
    if (!pack) return;
    save(); paint();
    if (!silent) {
      undoBag = pack;
      if (bag === "module") showHideToast();
      else showUndoToast();
    }
  }

  function focusNew(sel) {
    requestAnimationFrame(() => {
      const el = document.querySelector(sel);
      if (el) {
        el.dataset.new = "1";
        beginEdit(el);
      }
    });
  }

  function addInModule(type, cat, date, scope) {
    if (editingEl) commitEdit(true);
    const id = uid();
    if (type === "todo" || type === "week") {
      const inWeek = type === "week" || scope === "week";
      const d = date || (type === "week" ? selectedWeekDay : todayYmd());
      state.todos.unshift({ id, text: "", cat: cat || "📌 收件", date: d, done: false, kind: "todo" });
      save(); paint();
      focusNew(`${inWeek ? "#weekList" : "#todoCats"} [data-edit="todo"][data-id="${id}"]`);
    } else if (type === "note") {
      state.notes.unshift({ id, text: "", kind: "note" });
      save(); paint(); focusNew(`[data-edit="note"][data-id="${id}"]`);
    } else if (type === "spark") {
      state.sparks.unshift({ id, text: "", kind: "spark" });
      save(); paint(); focusNew(`[data-edit="spark"][data-id="${id}"]`);
    } else if (type === "month") {
      state.month.push({ id, sec: "life", ico: "•", t: "", tags: [["life","生活"]], done: false });
      save(); paint(); focusNew(`[data-edit="month"][data-id="${id}"]`);
    } else if (type === "quote") {
      const color = QUOTE_COLORS[state.quotes.length % QUOTE_COLORS.length];
      state.quotes.push({ id, text: "", color });
      save(); paint(); focusNew(`[data-edit="quote"][data-id="${id}"]`);
    } else if (type === "motto") {
      state.mottos.push({ id, text: "" });
      save(); paint(); focusNew(`[data-edit="motto"][data-id="${id}"]`);
    } else if (type === "clip") {
      state.clips.push({ id, title: "", thumb: "./assets/clip-a.svg", href: "https://" });
      save(); paint(); focusNew(`[data-edit="clip"][data-id="${id}"]`);
    } else if (type === "mind") {
      if (!state.mind.length) {
        state.mind.push({ id: uid(), title: "新分组", ico: "📝", items: [] });
      }
      const sec = state.mind[0];
      const itemId = uid();
      sec.items.push({ id: itemId, text: "" });
      save(); paint(); focusNew(`[data-edit="mind-item"][data-id="${itemId}"]`);
    }
  }

  /* events */
  document.getElementById("captureForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("captureInput");
    const text = input.value.trim();
    if (!text) return;
    captureText(text);
    input.value = "";
  });
  document.getElementById("fabAdd").addEventListener("click", () => {
    document.getElementById("captureInput").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("toastChange").addEventListener("click", () => {
    document.getElementById("toast").classList.add("picking");
  });
  document.getElementById("toastUndo").addEventListener("click", () => {
    const a = toastAction; toastAction = null;
    clearTimeout(toastTimer);
    document.getElementById("toast").classList.remove("show", "undo-mode", "picking");
    if (a) a.fn();
  });
  document.querySelector(".toast-picker").addEventListener("click", e => {
    const btn = e.target.closest("[data-kind]");
    if (!btn || !lastId) return;
    const kind = btn.dataset.kind;
    let item = null;
    for (const k of ["todos", "notes", "sparks"]) {
      const i = state[k].findIndex(x => x.id === lastId);
      if (i >= 0) { item = state[k].splice(i, 1)[0]; break; }
    }
    if (!item) return;
    item.kind = kind;
    if (kind === "todo") { item.cat = item.cat || "📌 收件"; item.date = item.date || todayYmd(); state.todos.unshift(item); }
    else if (kind === "note") state.notes.unshift(item);
    else state.sparks.unshift(item);
    let few = {};
    try { few = JSON.parse(localStorage.getItem(FEW) || "{}"); } catch {}
    few[item.text] = kind; localStorage.setItem(FEW, JSON.stringify(few));
    save(); paint(); showToast(kind, item.id);
  });

  // chips: keep focus in the editable (no blur-save race)
  ["pointerdown", "mousedown"].forEach(t => document.body.addEventListener(t, e => {
    if (e.target.closest(".cat-chip")) e.preventDefault();
  }));
  document.body.addEventListener("click", e => {
    const chip = e.target.closest(".cat-chip");
    if (chip) {
      e.preventDefault(); e.stopPropagation();
      if (!editingEl) return;
      editCat = chip.dataset.chip;
      chip.parentElement.querySelectorAll(".cat-chip").forEach(b => b.classList.toggle("on", b === chip));
      if (document.activeElement !== editingEl) editingEl.focus();
      return;
    }
    const catAdd = e.target.closest("[data-add-cat]");
    if (catAdd) {
      e.preventDefault(); e.stopPropagation();
      addInModule("todo", catAdd.dataset.addCat, catAdd.dataset.date, catAdd.closest("#weekList") ? "week" : "today");
      return;
    }
    const wday = e.target.closest("[data-week-day]");
    if (wday) {
      e.preventDefault(); e.stopPropagation();
      if (editingEl) commitEdit(true);
      selectedWeekDay = wday.dataset.weekDay;
      renderWeek();
      return;
    }
    const addBtn = e.target.closest("[data-add]");
    if (addBtn) {
      e.preventDefault();
      e.stopPropagation();
      addInModule(addBtn.dataset.add);
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del) {
      e.preventDefault();
      e.stopPropagation();
      deleteItem(del.dataset.del, del.dataset.id, del.dataset.sec);
      return;
    }
    const open = e.target.closest(".clip-open");
    if (open) {
      e.preventDefault();
      e.stopPropagation();
      const href = open.dataset.href;
      if (href && /^https?:\/\//i.test(href)) window.open(href, "_blank", "noopener");
      return;
    }
    const jump = e.target.closest("[data-jump]");
    if (jump) {
      const mk = SEC_TO_MOD[jump.dataset.jump];
      if (mk && state.hidden.includes(mk)) showModule(mk);
      const el = document.getElementById(jump.dataset.jump);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    const chk = e.target.closest(".check");
    if (chk) {
      e.preventDefault();
      e.stopPropagation();
      if (chk.dataset.todo) {
        const row = chk.closest("[data-id]");
        const it = state.todos.find(t => t.id === row.dataset.id);
        if (it) { it.done = !it.done; save(); paint(); }
        return;
      }
      if (chk.dataset.month) {
        const row = chk.closest("[data-id]");
        const it = state.month.find(t => t.id === row.dataset.id);
        if (it) { it.done = !it.done; save(); paint(); }
      }
      return;
    }
    const ed = e.target.closest(".editable");
    if (ed) {
      if (ed.closest("a.links-item") && e.target.closest("a.links-item") && !e.metaKey) {
        e.preventDefault();
      }
      if (ed.closest("summary")) e.preventDefault();
      beginEdit(ed);
      return;
    }
    // click blank → commit
    if (editingEl) commitEdit(true);
  });

  document.body.addEventListener("keydown", e => {
    if (!editingEl) return;
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter") {
      e.preventDefault();
      commitEdit(true);
    } else if (e.key === "Escape") {
      e.preventDefault();
      commitEdit(false);
    }
  });

  document.body.addEventListener("focusout", e => {
    if (!editingEl) return;
    // only when the editable itself loses focus (ignore focus moving FROM the + button INTO it)
    if (e.target !== editingEl) return;
    if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".cat-chips")) return;
    const leaving = editingEl;
    setTimeout(() => {
      if (editingEl === leaving && document.activeElement !== leaving) commitEdit(true);
    }, 120);
  });

  /* mobile swipe-left delete — direction-locked, 70px, spring back */
  (function bindSwipe() {
    const THRESHOLD = 70, LOCK = 10;
    let startX = 0, startY = 0, row = null, dx = 0, mode = null; // null | "h" | "v"
    const reset = r => { if (!r) return; r.classList.remove("swiping"); r.style.transform = ""; };
    document.body.addEventListener("touchstart", e => {
      if (window.matchMedia("(min-width:900px)").matches || e.touches.length !== 1) return;
      const t = e.target.closest(".swipeable");
      if (!t || e.target.closest(".check, .mod-add, .cat-add, .cat-chips, .clip-open, .editable.editing")) return;
      row = t; startX = e.touches[0].clientX; startY = e.touches[0].clientY; dx = 0; mode = null;
    }, { passive: true });
    document.body.addEventListener("touchmove", e => {
      if (!row) return;
      const adx = e.touches[0].clientX - startX, ady = e.touches[0].clientY - startY;
      if (!mode) {
        if (Math.abs(adx) < LOCK && Math.abs(ady) < LOCK) return;
        // mostly-horizontal and leftward, else treat as scroll
        mode = (Math.abs(adx) > Math.abs(ady) * 1.5 && adx < 0) ? "h" : "v";
        if (mode === "v") { reset(row); row = null; return; }
        row.classList.add("swiping");
      }
      dx = Math.min(0, adx);
      row.style.transform = `translateX(${dx}px)`;
    }, { passive: true });
    const end = cancel => {
      if (!row) return;
      const r = row; row = null;
      if (!cancel && mode === "h" && dx <= -THRESHOLD) {
        r.classList.remove("swiping");
        r.classList.add("swipe-out");
        const { bag, id, sec } = r.dataset;
        setTimeout(() => { if (bag) deleteItem(bag, id, sec); }, 180);
      } else {
        reset(r); // spring back via .swipeable transition
      }
      mode = null; dx = 0;
    };
    document.body.addEventListener("touchend", () => end(false));
    document.body.addEventListener("touchcancel", () => end(true));
  })();

  document.getElementById("dockSearch").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const hit = [...document.querySelectorAll(".row .t, .todo-item .txt, .mind-li .txt, .quote.editable")].find(n => n.textContent.toLowerCase().includes(q));
    if (hit) hit.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  if (EMPTY_DEMO) document.body.classList.add("empty-demo");
  (function slimDockSearch(){
    const inp = document.getElementById("dockSearch");
    if (!inp) return;
    const full = inp.getAttribute("placeholder") || "搜待办 / 小记 / 门牌";
    const apply = () => { inp.placeholder = matchMedia("(max-width:899px)").matches ? "搜" : full; };
    apply(); matchMedia("(max-width:899px)").addEventListener("change", apply);
  })();
  Object.entries(MODULES).forEach(([k, m]) => {
    const card = document.getElementById(m.sec);
    const add = card && card.querySelector(".mod-add");
    if (!add) return;
    const del = document.createElement("button");
    del.type = "button"; del.className = "mod-del";
    del.dataset.del = "module"; del.dataset.id = k;
    del.setAttribute("aria-label", "移除板块"); del.title = "移除板块";
    del.textContent = "×";
    add.after(del);
    const head = add.closest("h2, .month-head");
    if (head) { head.classList.add("swipeable"); head.dataset.bag = "module"; head.dataset.id = k; }
  });
  greeting();
  paint();

  function maybeDoorBreath() {
    try {
      if (localStorage.getItem("personal-hub-door-breathe-v2")) return;
      localStorage.setItem("personal-hub-door-breathe-v2", "1");
    } catch {}
    const el = document.querySelector(".dock-bar");
    if (!el) return;
    el.classList.remove("breathe");
    void el.offsetWidth;
    el.classList.add("breathe");
    el.addEventListener("animationend", () => el.classList.remove("breathe"), { once: true });
  }

  (function bindDockLP() {
    const dock = document.querySelector('.dock');
    const bar = document.querySelector('.dock-bar');
    const sheet = document.getElementById('linksSheet');
    if (!dock || !bar || !sheet) return;
    const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t = null;
    let armed = false;
    let openedByLP = false;
    const open = () => {
      t = null;
      openedByLP = true;
      armed = false;
      dock.classList.remove('pressing');
      sheet.hidden = false;
      if (reduce()) sheet.classList.add('open');
      else requestAnimationFrame(() => sheet.classList.add('open'));
      maybeDoorBreath();
    };
    const close = () => {
      sheet.classList.remove('open');
      const ms = reduce() ? 0 : 200;
      setTimeout(() => { sheet.hidden = true; }, ms);
    };
    const clearPress = () => {
      if (t) { clearTimeout(t); t = null; }
      dock.classList.remove('pressing');
      armed = false;
    };
    bar.addEventListener('pointerdown', e => {
      if (e.button != null && e.button !== 0) return;
      if (e.target.closest('#dockSearch, #fabAdd, .fab, .links-sheet')) return;
      openedByLP = false;
      armed = true;
      dock.classList.add('pressing');
      t = setTimeout(open, 480);
    });
    const endPress = e => {
      const wasArmed = armed;
      const wasOpen = openedByLP;
      clearPress();
      if (wasArmed && !wasOpen && e && e.type === 'pointerup') {
        if (!e.target.closest('.mod, button, a')) {
          const input = document.getElementById('dockSearch');
          if (input) input.focus();
        }
      }
    };
    ['pointerup','pointercancel','pointerleave'].forEach(ev => bar.addEventListener(ev, endPress));
    dock.addEventListener('click', e => {
      if (!openedByLP) return;
      if (e.target.closest('.mod')) {
        e.preventDefault();
        e.stopPropagation();
      }
      openedByLP = false;
    }, true);
    sheet.addEventListener('click', e => { if (e.target === sheet) close(); });
    document.getElementById('linksClose').addEventListener('click', close);
  })();

  document.getElementById("linkAdd").addEventListener("click", () => {
    const name = document.getElementById("linkName").value.trim();
    let url = document.getElementById("linkUrl").value.trim();
    if (!name || !url) return;
    if (!/^https?:\/\//i.test(url)) return;
    const list = getLinks();
    list.push({ id: uid(), name, url });
    saveLinks(list);
    linksCache = list;
    document.getElementById("linkName").value = "";
    document.getElementById("linkUrl").value = "";
    renderLinks();
  });

})();
</script>
